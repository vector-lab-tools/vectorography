<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vectorography · type design by traversal</title>
    <meta name="description" content="A vector space of letterforms that is travelled rather than prompted. Move through a space fitted to 441 families and compile the journey into a variable font." />

    <!-- What a link to this becomes when it is pasted somewhere. The scraper
         that unfurls it fetches the page and then one image; it runs no
         JavaScript, so the card is a static picture rather than the location
         whoever pasted the link was standing in. Regenerate it with
         tools/make_og.py. At deploy, make the two image URLs absolute:
         several scrapers, WhatsApp among them, will not resolve a relative
         one. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vectorography" />
    <meta property="og:title" content="Vectorography · type design by traversal" />
    <meta property="og:description" content="A vector space of letterforms that is travelled rather than prompted." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The word Vectorography set in a typeface decoded from the centre of the space, with its readings beneath." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vectorography · type design by traversal" />
    <meta name="twitter:description" content="A vector space of letterforms that is travelled rather than prompted." />
    <meta name="twitter:image" content="/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
