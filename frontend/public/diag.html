<body style="background:#faf8f4;padding:24px;font-family:monospace">
<style>
@font-face { font-family:"VGTest"; src:url("/test-vf.ttf") format("truetype");
             font-weight:normal; font-style:normal; }
.s { font-family:"VGTest"; font-size:52px; line-height:1.25; color:#1a1a1a; }
.l { color:#7c2d36; font-size:11px; }
</style>
<div class="l">THE EXPORTED VARIABLE FONT, LOADED BY THE BROWSER, ACROSS ITS JOURNEY AXIS</div>
<div id="out"></div>
<script>
const o = document.getElementById("out");
for (const v of [0,200,400,600,800,1000]) {
  o.insertAdjacentHTML("beforeend",
   `<div class="l" style="margin-top:14px">JRNY = ${v}</div>
    <div class="s" style="font-variation-settings:'JRNY' ${v}">Hamburgefonstiv 123</div>`);
}
document.fonts.ready.then(()=>{ document.title = "fonts-ready"; });
</script>
</body>
